aid: everest
name: Everest
description: Everest is an early-stage Y Combinator (Fall 2025 / F25) startup based
  in San Francisco building agent-ready technical support for developer tools. Its
  premise is that a growing share of a devtool's users will be coding agents rather
  than humans, and Everest helps devtool companies sell to and support those coding
  agents with instant technical support. The company was founded in 2026 by co-founders
  Yolanda Cao and Spencer McKee. As of this profile Everest operates a single marketing
  landing page (everestagi.com) with no public API, developer documentation, SDKs,
  or other developer surface yet published; this record is maintained as a lead for
  the API Evangelist enrichment pipeline.
